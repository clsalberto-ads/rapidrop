name: rapidrop

networks:
  rapidrop-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  minio-data:
  tempo-data:
  glitchtip-data:

services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rapidrop
      POSTGRES_USER: rapidrop
      POSTGRES_PASSWORD: rapidrop_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rapidrop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidrop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rapidrop-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rapidrop-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rapidrop-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - rapidrop-net

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - rapidrop-net

  tempo:
    image: grafana/tempo:latest
    ports:
      - "4317:4317"
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo-data:/var/tempo/traces
    networks:
      - rapidrop-net
    command: ["-config.file=/etc/tempo/tempo.yml"]

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rapidrop
      MINIO_ROOT_PASSWORD: rapidrop_dev
    volumes:
      - minio-data:/data
    networks:
      - rapidrop-net
    command: server /data --console-address ":9001"

  glitchtip:
    image: glitchtip/glitchtip:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://rapidrop:rapidrop_dev@postgres:5432/glitchtip
      SECRET_KEY: rapidrop-glitchtip-dev-secret-key-change-in-prod
      PORT: "8000"
      DISABLE_USER_REGISTRATION: "True"
      ALLOWED_HOSTS: "localhost,glitchtip,127.0.0.1"
      EMAIL_URL: smtp://localhost:25
      CACHE_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "True"
      GLITCHTIP_EMBED_WORKER: "true"
      VTASKS_CONCURRENCY: "4"
    volumes:
      - glitchtip-data:/app/data
    networks:
      - rapidrop-net
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    command: celery -A glitchtip worker -l INFO
    environment:
      DATABASE_URL: postgres://rapidrop:rapidrop_dev@postgres:5432/glitchtip
      SECRET_KEY: rapidrop-glitchtip-dev-secret-key-change-in-prod
      PORT: "8000"
      DISABLE_USER_REGISTRATION: "True"
      ALLOWED_HOSTS: "localhost,glitchtip,127.0.0.1"
      EMAIL_URL: smtp://localhost:25
      CACHE_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "False"
    volumes:
      - glitchtip-data:/app/data
    networks:
      - rapidrop-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
