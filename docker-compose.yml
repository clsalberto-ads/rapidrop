name: rapidrop

networks:
  rapidrop-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  minio-data:

services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rapidrop
      POSTGRES_USER: rapidrop
      POSTGRES_PASSWORD: rapidrop_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - rapidrop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidrop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rapidrop-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rapidrop-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rapidrop-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - rapidrop-net

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - rapidrop-net

  tempo:
    image: grafana/tempo:latest
    ports:
      - "4317:4317"
    networks:
      - rapidrop-net

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rapidrop
      MINIO_ROOT_PASSWORD: rapidrop_dev
    volumes:
      - minio-data:/data
    networks:
      - rapidrop-net
    command: server /data --console-address ":9001"
